<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'" />
<title>任务栏歌词</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:transparent;overflow:hidden;-webkit-user-select:none;cursor:default}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:"Microsoft YaHei UI","PingFang SC",system-ui,sans-serif;
    padding:0 10px;
    /* 任务栏本身是半透明/彩色，纯透明底会让白字糊掉，给一层很淡的底衬 */
    background:rgba(20,20,24,.34);
    border-radius:6px;
  }
  body.light{background:rgba(250,250,252,.42)}
  #line{
    width:100%;text-align:center;
    font-size:12.5px;line-height:1.2;font-weight:600;
    color:rgba(255,255,255,.94);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    text-shadow:0 1px 3px rgba(0,0,0,.85);
    transition:opacity .18s ease,transform .18s ease;
  }
  body.light #line{color:rgba(20,20,22,.9);text-shadow:0 1px 2px rgba(255,255,255,.7)}
  #line.swap{opacity:0;transform:translateY(4px)}
  body.empty #line{opacity:0}
</style>
</head>
<body class="empty">
  <div id="line"></div>
<script src="taskbar-lyric.js"></script>
</body>
</html>
