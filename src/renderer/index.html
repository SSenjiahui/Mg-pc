<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:;" />
<title>咪咕音乐</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="lattice-lyrics.css" />
</head>
<body>
<div id="app">

  <!-- 窗口层：底色 + 拖拽条 -->
  <div class="win-drag"></div>

  <!-- ══ 侧栏面板 ══ -->
  <aside class="sidebar">
    <div class="sb-head">
      <div class="sb-brand">
        <svg viewBox="0 0 24 24" class="sb-logo"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
        <span>咪咕音乐</span>
      </div>
      <div class="sb-navbtns">
        <button class="icon-btn tiny" id="navBack" title="后退">
          <svg viewBox="0 0 24 24"><path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z"/></svg>
        </button>
        <button class="icon-btn tiny" id="navFwd" title="前进">
          <svg viewBox="0 0 24 24"><path d="M8.6 16.6 10 18l6-6-6-6-1.4 1.4L13.2 12z"/></svg>
        </button>
      </div>
    </div>

    <div class="sb-profile">
      <div class="acc" id="accBox" title="个人中心">
        <div class="acc-avatar" id="accAva"><span id="accAvaTxt">咪</span><img id="accAvaImg" alt="" hidden /></div>
        <div class="acc-info">
          <div class="acc-name" id="accName">未登录</div>
          <div class="acc-sub" id="accSub">点击登录咪咕账号</div>
        </div>
        <svg class="acc-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6z"/></svg>
      </div>
    </div>

    <div class="sb-shortcut">
      <button class="sc-btn" data-view="favorite" title="收藏">
        <svg viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 16.1 12 21 12 21"/></svg>
      </button>
      <button class="sc-btn" data-view="recent" title="最近播放">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 8.5 12h-2.1A7 7 0 1 1 13 5v3.5L18 5l-5-3.5zM11 8v5.4l4.5 2.6.8-1.3-3.8-2.2V8z"/></svg>
      </button>
    </div>

    <nav class="sb-nav">
      <a class="side-item" data-view="home">
        <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3z"/></svg><span>为您推荐</span>
      </a>
      <a class="side-item" data-view="rank">
        <svg viewBox="0 0 24 24"><path d="M4 20h4V9H4zm6 0h4V4h-4zm6 0h4v-7h-4z"/></svg><span>排行榜</span>
      </a>
      <a class="side-item" data-view="newSongs">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg><span>新歌速递</span>
      </a>
      <a class="side-item" data-view="singer">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5m0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5"/></svg><span>歌手</span>
      </a>
      <a class="side-item" data-view="search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg><span>探索发现</span>
      </a>
    </nav>

    <div class="sb-group">
      <div class="sb-group-head">
        <span>我的歌单</span>
      </div>
      <a class="side-item" data-view="favorite">
        <svg viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 16.1 12 21 12 21"/></svg><span>我最喜爱</span>
      </a>
      <a class="side-item" data-view="recent">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 8.5 12h-2.1A7 7 0 1 1 13 5v3.5L18 5l-5-3.5zM11 8v5.4l4.5 2.6.8-1.3-3.8-2.2V8z"/></svg><span>播放历史</span>
      </a>
    </div>

    <div class="sb-bottom">
      <button class="icon-btn" id="btnMin" title="最小化">
        <svg viewBox="0 0 24 24"><path d="M5 12h14v1.5H5z"/></svg>
      </button>
      <button class="icon-btn" id="btnMax" title="最大化">
        <svg viewBox="0 0 24 24"><path d="M5 5h14v14H5zm1.5 1.5v11h11v-11z"/></svg>
      </button>
      <button class="icon-btn" id="btnQueue" title="播放队列">
        <svg viewBox="0 0 24 24"><path d="M4 6h12v2H4zm0 5h12v2H4zm0 5h8v2H4zm12-2 5 3.5-5 3.5z"/></svg>
      </button>
      <button class="icon-btn" id="btnLyric" title="歌词">
        <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg>
      </button>
      <button class="icon-btn close" id="btnClose" title="关闭">
        <svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
      </button>
    </div>
  </aside>

  <!-- ══ 右区：主面板 + 播放面板 ══ -->
  <div class="workspace">
    <section class="panel main-panel">
      <header class="topbar">
        <div class="tb-nav">
          <button class="icon-btn" id="btnHome" title="首页">
            <svg viewBox="0 0 24 24"><path d="M12 3 2 12h3v9h6v-6h2v6h6v-9h3z"/></svg>
          </button>
        </div>
        <div class="tb-search">
          <svg viewBox="0 0 24 24" class="s-icon"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
          <input id="globalSearch" type="text" placeholder="搜索音乐、歌手、歌单" spellcheck="false" />
          <button class="s-go" id="searchGo">搜索</button>
          <div class="sugg" id="suggBox"></div>
        </div>
        <div class="tb-actions">
          <button class="icon-btn" id="btnLogin" title="登录">
            <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5m0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5"/></svg>
          </button>
        </div>
      </header>
      <main id="view" class="view"></main>
    </section>

    <section class="panel player-panel">
      <div class="pl-left">
        <div class="pl-cover" id="plCover">
          <svg viewBox="0 0 24 24" class="pl-cover-ph"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z"/></svg>
          <img id="plCoverImg" alt="" />
        </div>
        <div class="pl-meta">
          <div class="pl-title" id="plTitle">未在播放</div>
          <div class="pl-artist" id="plArtist">—</div>
        </div>
        <button class="icon-btn pl-like" id="plLike" title="收藏">
          <svg viewBox="0 0 24 24"><path d="M12 21s-8-4.9-8-10.4A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8 3.6C20 16.1 12 21 12 21"/></svg>
        </button>
      </div>

      <div class="pl-center">
        <div class="pl-ctrl">
          <button class="icon-btn" id="btnLoop" title="循环模式">
            <svg viewBox="0 0 24 24" id="loopIcon"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg>
          </button>
          <button class="icon-btn" id="btnPrev" title="上一首">
            <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
          </button>
          <button class="btn-play" id="btnPlay" title="播放/暂停">
            <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="icon-btn" id="btnNext" title="下一首">
            <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
          </button>
          <button class="icon-btn" id="btnLyric2" title="歌词">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 4h10v2H4zm0 4h16v2H4zm0 4h10v2H4z"/></svg>
          </button>
        </div>
        <div class="pl-progress">
          <span class="t" id="tCur">00:00</span>
          <div class="bar" id="seekBar"><div class="bar-bg"><div class="bar-fill" id="seekFill"></div><div class="bar-dot" id="seekDot"></div></div></div>
          <span class="t" id="tDur">00:00</span>
        </div>
      </div>

      <div class="pl-right">
        <div class="quality-select">
          <select id="selQuality" title="音质"></select>
        </div>
        <button class="icon-btn" id="btnMute" title="静音">
          <svg viewBox="0 0 24 24" id="volIcon"><path d="M4 9v6h4l5 5V4L8 9z"/><path d="M16 8.6a4.8 4.8 0 0 1 0 6.8l1.3 1.3a6.6 6.6 0 0 0 0-9.4z"/></svg>
        </button>
        <div class="vol-bar" id="volBar"><div class="bar-bg"><div class="bar-fill" id="volFill"></div></div></div>
      </div>
    </section>
  </div>

  <!-- 歌词面板 -->
  <div class="lyric-panel" id="lyricPanel">
    <div class="lp-head">
      <span>歌词</span>
      <button class="icon-btn" id="lpClose"><svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg></button>
    </div>
    <div class="lp-body" id="lpBody"></div>
  </div>

  <!-- 播放队列 -->
  <div class="queue-panel" id="queuePanel">
    <div class="lp-head">
      <span>播放队列 <em id="queueCount">0</em></span>
      <button class="icon-btn" id="qClose"><svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg></button>
    </div>
    <div class="qp-body" id="qpBody"></div>
  </div>

  <!-- 无法播放提示条 -->
  <div class="vip-tip" id="vipTip">
    <div class="vt-icon">
      <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5zm-1 13-3-3 1.4-1.4L11 12.2l4.6-4.6L17 9z"/></svg>
    </div>
    <div class="vt-body">
      <div class="vt-title" id="vtTitle">该歌曲需要白金会员</div>
      <div class="vt-sub" id="vtSub">版权方要求，开通会员后可播放</div>
    </div>
    <div class="vt-act">
      <button class="btn ghost" id="vtOpen">去开通</button>
      <button class="btn ghost" id="vtNext">下一首</button>
      <button class="icon-btn" id="vtClose" title="关闭">
        <svg viewBox="0 0 24 24"><path d="m6.4 5 5.6 5.6L17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>
<script src="errors.js"></script>
<script src="lattice-lyrics.js"></script>
<script src="app.js"></script>
</body>
</html>
